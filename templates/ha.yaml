# HA cluster template for zkvm
# ─────────────────────────────
# 3 control-plane nodes + N worker nodes.
# All VMs are created inside ONE KVM host LPAR.
# Fill in all values marked with <REPLACE>.
# Apply with: kubectl apply -f ha.yaml --kubeconfig <bootstrap-kubeconfig>
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ZKVMCluster
metadata:
  name: <REPLACE-cluster-name>
  namespace: default
spec:
  kvmHost: "<REPLACE-kvm-host-ip>"                               # IP of the KVM host LPAR
  sshUser: "root"                                                # SSH user for KVM host
  sshKeySecretRef:
    name: "zkvm-ssh-key"                                         # Secret containing ssh-privatekey
  storagePool: "default"                                          # virsh pool-list --all
  networkBridge: "virbr0"                                        # Linux bridge interface (e.g. virbr0 for NAT)
  kernelPath: "/var/www/html/agent.s390x-vmlinuz"                # absolute path on KVM host
  initrdPath: "/var/www/html/agent.s390x-initrd.img"            # absolute path on KVM host
  controlPlaneEndpoint:
    host: "<REPLACE-api-vip-or-first-cp-ip>"                     # API server VIP or first CP node IP
    port: 6443

---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: <REPLACE-cluster-name>
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.128.0.0/14"]
    services:
      cidrBlocks: ["172.30.0.0/16"]
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: ZKVMCluster
    name: <REPLACE-cluster-name>
    namespace: default
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: <REPLACE-cluster-name>-cp
    namespace: default

---
# Control-plane VM blueprint
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ZKVMMachineTemplate
metadata:
  name: <REPLACE-cluster-name>-cp-template
  namespace: default
spec:
  template:
    spec:
      vcpus: 4
      memoryGB: 16
      diskGB: 120

---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: <REPLACE-cluster-name>-cp
  namespace: default
spec:
  replicas: 3
  version: "v1.29.3"
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: ZKVMMachineTemplate
      name: <REPLACE-cluster-name>-cp-template
      namespace: default
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/crio/crio.sock
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/crio/crio.sock

---
# Worker VM blueprint (can differ from control-plane spec)
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ZKVMMachineTemplate
metadata:
  name: <REPLACE-cluster-name>-worker-template
  namespace: default
spec:
  template:
    spec:
      vcpus: 4
      memoryGB: 16
      diskGB: 120

---
# MachineDeployment: manages the worker node group.
# Change replicas to scale workers. Set min/max annotations for ClusterAutoscaler.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: <REPLACE-cluster-name>-workers
  namespace: default
  annotations:
    # ClusterAutoscaler annotations — set when enabling autoscaling (Phase 4)
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "10"
spec:
  clusterName: <REPLACE-cluster-name>
  replicas: 2            # starting worker count — adjust as needed
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: <REPLACE-cluster-name>
      cluster.x-k8s.io/deployment-name: <REPLACE-cluster-name>-workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: <REPLACE-cluster-name>
        cluster.x-k8s.io/deployment-name: <REPLACE-cluster-name>-workers
    spec:
      clusterName: <REPLACE-cluster-name>
      version: "v1.29.3"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: <REPLACE-cluster-name>-worker-bootstrap
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ZKVMMachineTemplate
        name: <REPLACE-cluster-name>-worker-template
        namespace: default
